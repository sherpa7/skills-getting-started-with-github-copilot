name: Test Application

on:
  push:
    branches: [ main, copilot/* ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run tests
      run: |
        pytest tests/ -v --tb=short
    
    - name: Test application startup
      run: |
        python -c "import subprocess, time; p = subprocess.Popen(['python', '-m', 'uvicorn', 'src.app:app', '--host', '0.0.0.0', '--port', '8000']); time.sleep(5); p.terminate(); p.wait()"
